name: 上传 Mac App Store 版本

on:
  workflow_dispatch:
    inputs:
      version:
        description: '商店版本号，例如 0.3.0'
        type: string
        required: true
      build_number:
        description: '新的构建号，例如 14'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mac-app-store-upload
  cancel-in-progress: false

env:
  LINSE_VERSION: ${{ inputs.version }}
  LINSE_BUILD_NUMBER: ${{ inputs.build_number }}

jobs:
  prepare:
    name: 检查商店上传配置
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检查分支、版本与凭证
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          HAS_CERTIFICATE: ${{ secrets.APP_STORE_CERTIFICATE_P12_BASE64 != '' }}
          HAS_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATE_PASSWORD != '' }}
          HAS_PROFILE: ${{ secrets.APP_STORE_PROFILE_BASE64 != '' }}
          HAS_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          [[ "$REPOSITORY" == deernova-studio/linse && "$REF" == refs/heads/main ]] || exit 1
          [[ "$LINSE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$LINSE_BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || exit 1
          if [[ "$HAS_CERTIFICATE" != true || "$HAS_PASSWORD" != true || "$HAS_PROFILE" != true || "$HAS_APP_PASSWORD" != true || ! "$APP_STORE_APP_ID" =~ ^[0-9]+$ || -z "$APPLE_ID" || "$APPLE_TEAM_ID" != LVWWAF3DBK ]]; then
            echo '::error::请先按 docs/app-store.md 配置商店签名和应用 ID。'
            exit 1
          fi

  upload:
    name: 编译、签名并上传 Apple 后台
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 验证共享代码
        run: bash scripts/check-ci.sh
      - name: 安装商店签名
        env:
          APP_STORE_CERTIFICATE_P12_BASE64: ${{ secrets.APP_STORE_CERTIFICATE_P12_BASE64 }}
          APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATE_PASSWORD }}
          APP_STORE_PROFILE_BASE64: ${{ secrets.APP_STORE_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash scripts/ci-app-store-signing.sh install
      - name: 归档并导出商店安装包
        run: |
          bash scripts/app-store.sh archive
          bash scripts/app-store.sh export
      - name: 验证并上传
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/app-store.sh upload
      - name: 清理临时签名
        if: always()
        run: bash scripts/ci-app-store-signing.sh cleanup
      - name: 保存商店安装包
        if: github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app-store-${{ github.run_id }}
          path: build/app-store/Linse-${{ inputs.version }}-build${{ inputs.build_number }}/export/*.pkg
          if-no-files-found: error
          retention-days: 7
      - name: 提示后续审核步骤
        run: echo '安装包已上传 Apple 后台，仍需等待处理并在 App Store Connect 选择版本、提交审核。此流程不会自动上架。' >> "$GITHUB_STEP_SUMMARY"
